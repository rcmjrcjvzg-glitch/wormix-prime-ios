name: Build Wormix Prime iOS
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Download Build Zip from Release
      run: |
        gh release download --pattern "WormixPrimeBuild.zip"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Unzip Build Files
      run: |
        unzip WormixPrimeBuild.zip
        ls -la

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download AIR SDK
      run: |
        curl -L -o airsdk.zip "https://airsdk.harman.com/assets/downloads/AIRSDK_Compiler_51.5.1.zip"
        unzip -q airsdk.zip -d airsdk

    - name: Build IPA
      run: |
        chmod +x airsdk/bin/adt
        ./airsdk/bin/adt -package -target ipa-test-interpreter -storetype pkcs12 -keystore cert.p12 -storepass 123456 -provisioning-profile dummy.mobileprovision WormixPrime.ipa application.xml wormix-mobile.swf wormix-game.swf -C . data -C . icon

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: WormixPrime-ipa
        path: WormixPrime.ipa
