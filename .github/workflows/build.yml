name: Build Wormix Prime iOS
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Build Zip from Release
      run: |
        gh release download --pattern "WormixPrimeBuild.zip"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Unzip Build Files
      run: |
        unzip WormixPrimeBuild.zip
        ls -la

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Adobe AIR SDK
      uses: joshtynjala/setup-adobe-air-action@v2
      with:
        air-version: "51.5.1"
        accept-license: true

    - name: Generate Valid MobileProvision
      run: |
        python3 -c "
        import plistlib
        profile = {
            'AppIDName': 'WormixPrime',
            'ApplicationIdentifierPrefix': ['ABCDE12345'],
            'CreationDate': '2024-01-01T00:00:00Z',
            'Platform': ['iOS'],
            'DeveloperCertificates': [b'fake_cert'],
            'Entitlements': {
                'application-identifier': 'ABCDE12345.ru.pragmatix.wormix.prime',
                'get-task-allow': True,
            },
            'ExpirationDate': '2030-01-01T00:00:00Z',
            'Name': 'WormixPrime',
            'TeamIdentifier': ['ABCDE12345'],
            'UUID': '12345678-1234-1234-1234-123456789012',
            'Version': 1
        }
        with open('dummy.mobileprovision', 'wb') as f:
            plistlib.dump(profile, f)
        "

    - name: Build IPA
      run: |
        adt -package -target ipa-test-interpreter -storetype pkcs12 -keystore cert.p12 -storepass 123456 -provisioning-profile dummy.mobileprovision WormixPrime.ipa application.xml wormix-mobile.swf wormix-game.swf -C . data -C . icon

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: WormixPrime-ipa
        path: WormixPrime.ipa
