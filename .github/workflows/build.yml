name: Build Wormix Prime iOS
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Build Zip from Release
      run: |
        gh release download --pattern "WormixPrimeBuild.zip"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Unzip and Flatten Files
      run: |
        unzip WormixPrimeBuild.zip -d temp_extract
        find temp_extract -mindepth 1 -maxdepth 1 -exec mv {} . \;
        if [ -d "WormixPrimeBuild" ]; then mv WormixPrimeBuild/* . ; fi
        ls -la

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Adobe AIR SDK
      uses: joshtynjala/setup-adobe-air-action@v2
      with:
        air-version: "51.5.1"
        accept-license: true

    - name: Generate Cert and Profile (OpenSSL Only)
      run: |
        # 1. Генерируем ключ и сертификат
        openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -days 3650 -nodes -subj "/CN=WormixPrime"
        openssl pkcs12 -export -in cert.pem -inkey key.pem -out cert.p12 -passout pass:123456
        
        # 2. Вытаскиваем DER для профиля
        openssl x509 -in cert.pem -outform der -out cert.der
        
        # 3. Пишем питоном валидный mobileprovision
        python3 -c "
        import plistlib
        with open('cert.der', 'rb') as f:
            cert_der = f.read()
        profile = {
            'AppIDName': 'WormixPrime',
            'ApplicationIdentifierPrefix': ['ABCDE12345'],
            'CreationDate': '2024-01-01T00:00:00Z',
            'Platform': ['iOS'],
            'DeveloperCertificates': [cert_der],
            'Entitlements': {'application-identifier': 'ABCDE12345.ru.pragmatix.wormix.prime', 'get-task-allow': True},
            'ExpirationDate': '2030-01-01T00:00:00Z',
            'Name': 'WormixPrime',
            'TeamIdentifier': ['ABCDE12345'],
            'UUID': '12345678-1234-1234-1234-123456789012',
            'Version': 1
        }
        with open('dummy.mobileprovision', 'wb') as f:
            plistlib.dump(profile, f)
        "

    - name: Build IPA
      run: |
        adt -package -target ipa-test-interpreter -storetype pkcs12 -keystore cert.p12 -storepass 123456 -alias wormix -keypass 123456 -provisioning-profile dummy.mobileprovision WormixPrime.ipa application.xml wormix-mobile.swf wormix-game.swf -C . data -C . icon

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: WormixPrime-ipa
        path: WormixPrime.ipa
